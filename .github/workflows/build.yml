name: Build · Muhou Text Theater

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-x64:
    name: macOS · x64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Electron Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          npx electron-builder \
            --mac --x64 --publish never \
            -c.mac.target=dmg,zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: muhou-macos-x64-${{ github.run_id }}
          path: release/*.{dmg,zip,blockmap}
          if-no-files-found: warn
          retention-days: 30

  build-macos-arm64:
    name: macOS · arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Electron Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          npx electron-builder \
            --mac --arm64 --publish never \
            -c.mac.target=dmg,zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: muhou-macos-arm64-${{ github.run_id }}
          path: release/*.{dmg,zip,blockmap}
          if-no-files-found: warn
          retention-days: 30

  build-windows:
    name: Windows · x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Electron Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --x64 --publish never -c.win.target=nsis,portable
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: muhou-windows-x64-${{ github.run_id }}
          path: release/*.{exe,blockmap}
          if-no-files-found: warn
          retention-days: 30
