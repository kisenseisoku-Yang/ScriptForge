name: Build · 幕后 文字剧场

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        - label: macOS · x64
          os: macos-13
          arch: x64
          targets: dmg,zip
        - label: macOS · arm64
          os: macos-latest
          arch: arm64
          targets: dmg,zip
        - label: Windows · x64
          os: windows-latest
          arch: x64
          targets: nsis,portable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Vite build
        run: npm run build

      # mac runner 上 electron-builder 自动 ad-hoc deep codesign（Helper + Framework + 主 app）
      - name: Electron Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          OS_FLAG="${{ matrix.os == 'windows-latest' && 'win' || 'mac' }}"
          TARGETS="${{ matrix.targets }}"
          npx electron-builder \
            --${OS_FLAG} \
            --${{ matrix.arch }} \
            --publish never \
            -c.${OS_FLAG}.target="${TARGETS}"

      - name: List artifacts
        shell: bash
        run: ls -lh release/ 2>/dev/null || dir release\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muhou-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 幕后 · 文字剧场 v${{ github.ref_name }}
          body: |
            ## 幕后 · 文字剧场 v${{ github.ref_name }}

            电影美学剧本 + 分镜工作台。

            ### 下载

            | 平台 | 架构 | 格式 |
            |------|------|------|
            | macOS | Intel (x64) | `.dmg` · `.zip` |
            | macOS | Apple Silicon (arm64) | `.dmg` · `.zip` |
            | Windows | x64 | NSIS 安装版 `.exe` · 便携版 `.exe` |

            ### 激活码

            测试通用码：**`SF-TEST-MUHOU-2026`**
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.blockmap
